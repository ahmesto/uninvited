# Try Uninvited on your own machine in two minutes. Nothing here is reachable from outside:
# every decoy listens on 127.0.0.1 on a high port, the dashboard is on loopback, DNS lookups
# and the Tor list download are off, and no GeoIP database is needed (locations show as unknown).
#
#   pip install -r requirements.txt
#   python -m uninvited --config config.quickstart.yaml      # leave it running
#   python tools/try_it.py                                # in a second terminal: knocks on every decoy
#
# Then open http://127.0.0.1:8090/ and watch the traffic arrive.
#
# This is a demo, not a deployment. To put decoys on the internet read docs/RUNNING.md and
# docs/SECURITY-MODEL.md first: the machine that runs them must be one you can lose.

listen_ip: 127.0.0.1

dashboard:
  host: 127.0.0.1
  port: 8090

database: ./data/quickstart.db
ssh_host_key: ./data/ssh_host_rsa_key
retention_days: 7
max_connections: 100

geoip:
  city_db: ""
  asn_db: ""

classify:
  rdns: false      # no outbound DNS from the demo
  tor: false       # no download of the Tor exit list

site:
  title: Uninvited
  tagline: a server left open on purpose
  url: 127.0.0.1:8090

services:
  - proto: SSH
    port: 2222
  - proto: TNET
    port: 2323
  - proto: FTP
    port: 2121
  - proto: HTTP
    port: 8081
  - proto: SMTP
    port: 2525
  - proto: RDP
    port: 33890
  - proto: SMB
    port: 4445
  - proto: SIP
    port: 5060
    udp: false
  - proto: MODBUS
    port: 5020
  - proto: S7
    port: 5102
  - proto: ENIP
    port: 44818
  - proto: DNP3
    port: 20001
  - proto: CAM
    port: 8083
    service: web
  - proto: CAM
    port: 8554
    service: rtsp
  - proto: ROUTER
    port: 8084
    service: web
  - proto: ROUTER
    port: 7547
    service: tr069
  - proto: MCP
    port: 8085
